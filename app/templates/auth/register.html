{% extends "base.html" %}
{% block title %}TaskFlow | Register{% endblock %}
{% block content %}
<section class="single-panel auth-wrap">
  <div class="panel auth-card">
    <h2>Create Account</h2>
    <p class="sub">Your tasks and categories are private per account.</p>
    <form method="post" action="{{ url_for('auth.register') }}" class="stack">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required minlength="3" />

      <label>Email</label>
      <input type="email" name="email" autocomplete="email" required />

      <label>Password</label>
      <input type="password" name="password" autocomplete="new-password" required minlength="8" />

      <label>Confirm Password</label>
      <input type="password" name="confirm_password" autocomplete="new-password" required minlength="8" />

      <button type="submit" class="btn primary">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
