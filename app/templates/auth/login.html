{% extends "base.html" %}
{% block title %}TaskFlow | Login{% endblock %}
{% block content %}
<section class="single-panel auth-wrap">
  <div class="panel auth-card">
    <h2>Login</h2>
    <p class="sub">Access your personal task workspace.</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="stack">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required />

      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required />

      <button type="submit" class="btn primary">Login</button>
    </form>
    <p class="auth-switch">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
  </div>
</section>
{% endblock %}
